{% extends "base.html" %}
{% block title %}{{ t('form_enregistrer_vente') }} - WaterLife Congo{% endblock %}

{% block content %}

<div class="form-box">
    <h2>{{ t('form_enregistrer_vente') }}</h2>

    <form method="POST">
        <div class="form-group">
            <label>{{ t('label_commercial') }}</label>
            <select name="commercial_id" required>
                <option value="">{{ t('option_choisir_commercial') }}</option>
                {% for c in commerciaux %}
                <option value="{{ c.id }}">{{ c.reference }} - {{ c.prenom }} {{ c.nom }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>{{ t('label_produit') }}</label>
            <select name="produit_id" required>
                <option value="">{{ t('option_choisir_produit') }}</option>
                {% for p in produits %}
                <option value="{{ p.id }}">{{ p.nom }} ({{ "%.0f"|format(p.prix_unitaire) }} FCFA)</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>{{ t('label_quantite') }}</label>
            <input type="number" name="quantite" min="1" value="1" required>
        </div>

        <button type="submit" class="btn btn-vert btn-full">{{ t('btn_enregistrer_vente') }}</button>
    </form>
</div>

{% endblock %}
