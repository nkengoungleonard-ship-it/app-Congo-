{% extends "base.html" %}
{% block title %}{{ t('btn_ajouter_gros') }} - WaterLife Congo{% endblock %}

{% block content %}

<div class="form-box">
    <h2>{{ t('btn_ajouter_gros') }}</h2>

    <form method="POST">
        <div class="form-group">
            <label>{{ t('gros_client') }}</label>
            <input type="text" name="client_nom" required placeholder="Ex : Hôpital Général de Brazzaville">
        </div>

        <div class="form-group">
            <label>{{ t('gros_type') }}</label>
            <select name="client_type" required>
                <option value="Entreprise">Entreprise</option>
                <option value="Hopital">Hôpital</option>
                <option value="Administration">Administration</option>
                <option value="Autre">Autre</option>
            </select>
        </div>

        <div class="form-group">
            <label>{{ t('gros_contact') }}</label>
            <input type="text" name="client_contact" placeholder="Ex : 06 123 45 67 ou nom du responsable">
        </div>

        <div class="form-group">
            <label>{{ t('label_produit') }}</label>
            <select name="produit_id" required>
                <option value="">{{ t('option_choisir_produit') }}</option>
                {% for p in produits %}
                <option value="{{ p.id }}">{{ p.nom }} ({{ "%.0f"|format(p.prix_unitaire) }} FCFA / unité)</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>{{ t('label_quantite') }}</label>
            <input type="number" name="quantite" min="1" value="1" required>
        </div>

        <div class="form-group">
            <label>{{ t('gros_montant_total') }}</label>
            <input type="number" step="0.01" name="montant_total" required placeholder="Ex : 250000">
        </div>

        <div class="form-group">
            <label>{{ t('gros_notes') }}</label>
            <input type="text" name="notes" placeholder="Ex : Livraison prévue le 25/07">
        </div>

        <button type="submit" class="btn btn-vert btn-full">{{ t('btn_enregistrer_gros') }}</button>
    </form>
</div>

{% endblock %}
