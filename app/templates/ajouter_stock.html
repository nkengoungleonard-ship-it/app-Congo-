{% extends "base.html" %}
{% block title %}Ajouter au stock - WaterLife Congo{% endblock %}
{% block content %}

<div class="form-page">
    <h2>Ajouter au stock — {{ produit.nom }}</h2>
    <p class="stock-info-actuel">Stock actuel : <strong>{{ produit.stock_actuel }}</strong> unité(s)</p>

    <form method="POST">
        <div class="form-group">
            <label>Quantité reçue</label>
            <input type="number" name="quantite" min="1" required>
        </div>

        <div class="form-group">
            <label>Motif (optionnel)</label>
            <input type="text" name="motif" placeholder="Ex: Arrivage fournisseur, réapprovisionnement...">
        </div>

        <button type="submit" class="btn btn-full">Ajouter au stock</button>
        <a href="{{ url_for('main.liste_stock') }}" class="btn-annuler">Annuler</a>
    </form>
</div>

{% endblock %}
